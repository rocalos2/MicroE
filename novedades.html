<script>

/* When the user clicks on the button, 
toggle between hiding and showing the dropdown content */
function myFunction() {
  document.getElementById("myDropdown").classList.toggle("show");
}

// Close the dropdown if the user clicks outside of it
window.onclick = function(event) {
  if (!event.target.matches('.dropbtn')) {
    var dropdowns = document.getElementsByClassName("dropdown-content");
    var i;
    for (i = 0; i < dropdowns.length; i++) {
      var openDropdown = dropdowns[i];
      if (openDropdown.classList.contains('show')) {
        openDropdown.classList.remove('show');
      }
    }
  }
}
</script>

<!-- 1. HTML: Imagen disparadora y Modal -->
<img id="myImg" alt="" >
<div id="myModal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="img01">
  <div id="caption"></div>
</div>

<!-- 2. CSS: Estilos para el modal -->
<style>
.modal {
  display: flex;             /* Activa Flexbox */
  align-items: center;       /* Centrado vertical */
  
  /* Propiedades estándar del modal */
  position: fixed; 
  z-index: 1; 
  left: 0;
  top: 0;
  width: 100%; 
  height: 100%; 
  overflow: auto; 
  background-color: rgb(206 175 249 / 90%);
}

.modal-content {
    margin: auto;
    top: 70px;
    position: absolute;
    top: 60px;
    color: #f1f1f1;
    width: 100%;
}

.close {
  position: absolute;
  top: 15px; right: 35px;
  color: #f1f1f1;
  font-size: 40px;
  cursor: pointer;
}
</style>

<!-- 3. JavaScript: Lógica de apertura y cierre -->
<script>

var modal = document.getElementById("myModal");
var img = document.getElementById("myImg");
var modalImg = document.getElementById("img01");
var captionText = document.getElementById("caption");

img.onclick = function() {
  modal.style.display = "block";
  modalImg.src = this.src;
  captionText.innerHTML = this.alt;
}

var span = document.getElementsByClassName("close")[0];
span.onclick = function() {
  modal.style.display = "none";
}

window.onload = function(){
    modal.style.display = "block";
    modalImg.src = "imagenes/maronnapopup.png";
    captionText.innerHTML = img.alt;
}
</script>
